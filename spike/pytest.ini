; Phase 1 spike test config — deliberately lives INSIDE spike/ so it is deleted with
; the directory (SC#5). Do NOT move this to a root pytest.ini or add
; [tool.pytest.ini_options] to a root pyproject.toml: Phase 2 (FOUND-01) owns the uv
; workspace and Phase 1 must not anticipate it.
;
; Because this file is the nearest ini file to the `spike/` argument, pytest's rootdir
; is spike/ — so `testpaths = .` below IS spike/.

[pytest]
testpaths = .

; Quick suite:  uv run pytest spike/ -x -q -m "not slow"
; Full suite:   uv run pytest spike/ -q
; `slow` is NOT filtered here via addopts on purpose — the full suite must be able to
; run everything without having to undo a default.
markers =
    slow: touches a real model (downloads, loads, or runs inference). Excluded from the quick suite.

; Async harnesses (bake-off streaming, MCP stdio) are written without an explicit
; @pytest.mark.asyncio. Requires pytest-asyncio; if a venv lacks it, pytest emits an
; "Unknown config option" warning, which is itself a useful signal.
asyncio_mode = auto

addopts = --strict-markers
