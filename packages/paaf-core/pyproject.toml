# SPDX-License-Identifier: Apache-2.0
[project]
name = "paaf-core"
version = "0.1.0"
description = "PAAF core: typed config, atomic writes, secret store, endpoint declaration, reload tiers."
requires-python = ">=3.12"
# Runtime deps declared NOW so later same-wave plans never edit this manifest
# (config schema on pydantic, YAML round-trip on ruamel.yaml, audited crypto for the
# secret store, filelock for the optimistic-revision critical section).
dependencies = [
    "pydantic",
    "ruamel.yaml",
    "cryptography",
    "filelock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paaf_core"]
