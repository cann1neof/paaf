# SPDX-License-Identifier: Apache-2.0
[project]
name = "paaf-llm"
version = "0.1.0"
description = "PAAF LLM management: model profiles, prompt composition, and the agent turn loop."
requires-python = ">=3.12"
# FOUND-02 / MODEL-08: paaf-llm carries NO voice or audio deps, and NO agent
# framework. These are the base deps only — langchain lives behind the optional
# `[engine]` extra so the wheel runs framework-uninstalled (SC#1) and the
# clean-venv wheel job keeps proving independence from paaf-voice.
dependencies = [
    "paaf-core",
    "paaf-trace",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "click>=8.4",
    "rich>=15",
]

# MODEL-01/02/08: the agent framework, and the ONLY place it appears. Installing
# this extra is what turns `paaf_llm._engine.LangChainAdapter` from an import
# error into a working binding for real Ollama / OpenAI-compatible / Anthropic
# profiles. NOT installing it must leave the entire fake-adapter suite green with
# `import langchain` raising ModuleNotFoundError — that is SC#1, and the
# clean-venv wheel job asserts it.
#
# Versions are pinned EXACTLY, not to a compatible range (threat T-03-SC, supply
# chain). The LangChain family is pre-approved by the phase's Package Legitimacy
# Audit — real repos, MIT, selected via a Phase-1 spike — so no human-verify gate
# applies, but the audit's other half does: an unpinned `~=` range would let a
# future release enter a build nobody reviewed. Pins verified against the PyPI
# JSON API on 2026-08-05.
#
# `langchain-anthropic` is held at the newest 1.4.x rather than the 1.5.4 that
# published hours before this pin was chosen: same-day releases are exactly the
# window a compromised publish is undetected in, and 1.4.x is the range the
# phase's research recommended. Bumping it is a deliberate, reviewable edit.
[project.optional-dependencies]
engine = [
    "langchain==1.3.14",
    "langgraph==1.2.10",
    "langchain-ollama==1.1.0",
    "langchain-anthropic==1.4.8",
    "langchain-openai==1.4.1",
]

[tool.uv.sources]
paaf-core = { workspace = true }
paaf-trace = { workspace = true }

# The `paaf` CLI (D-01/D-02). Declared now; `paaf_llm.cli` lands later in this
# phase — console-script entry points resolve lazily at invocation, not install.
[project.scripts]
paaf = "paaf_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paaf_llm"]

# FOUND-02 / Plan 03: ship the wheel smoke test INSIDE the package so the
# clean-venv job can discover it with `pytest --pyargs paaf_llm` (RESEARCH
# Pitfall 2).
#
# MODEL-08 / SC#1 (Plan 09): the ENTIRE fake-adapter suite ships too, for the
# same reason and one bigger one. SC#1 is not "a smoke test passes without the
# agent framework", it is "the whole suite passes without it" — and a claim that
# only a three-assertion smoke file can check is a claim nobody is really
# checking. Shipping the suite is what lets
# `scripts/check_framework_uninstalled.sh` run `pytest --pyargs paaf_llm` inside
# a clean venv that has paaf-core and paaf-trace but NO langchain, and have that
# run mean something: profiles, prompt composition, the agent turn, the fallback
# chain, the CLI inspector, and the no-leak guards all execute against the fake
# with the framework genuinely absent.
#
# Deliberately NOT shipped: `tests/test_engine_adapter.py`. It exists to test the
# REAL LangChain adapter and opens with `pytest.importorskip("langchain")`, so in
# the clean venv it could only ever SKIP — a skipped test inside the artifact
# whose whole point is "no framework here" muddies the gate rather than
# strengthening it. It runs from the source tree instead, in the complementary
# `.github/workflows/engine-adapter.yml` job, WITH the `[engine]` extra installed
# so it actually executes.
#
# Every file listed here must import only paaf_llm + paaf_core + paaf_trace (and
# their declared deps: pydantic, pyyaml, click, rich, aiosqlite). If a new test
# file needs the framework, it belongs with test_engine_adapter.py — outside this
# block — not in the shipped set.
[tool.hatch.build.targets.wheel.force-include]
"tests/test_wheel_smoke.py" = "paaf_llm/tests/test_wheel_smoke.py"
"tests/conftest.py" = "paaf_llm/tests/conftest.py"
"tests/test_smoke.py" = "paaf_llm/tests/test_smoke.py"
"tests/test_ports.py" = "paaf_llm/tests/test_ports.py"
"tests/test_fake_adapter.py" = "paaf_llm/tests/test_fake_adapter.py"
"tests/test_profiles.py" = "paaf_llm/tests/test_profiles.py"
"tests/test_compose.py" = "paaf_llm/tests/test_compose.py"
"tests/test_agent_turn.py" = "paaf_llm/tests/test_agent_turn.py"
"tests/test_fallback.py" = "paaf_llm/tests/test_fallback.py"
"tests/test_inspector.py" = "paaf_llm/tests/test_inspector.py"
"tests/test_no_leak.py" = "paaf_llm/tests/test_no_leak.py"
# Phase 4 / SC#5: the mesh suite. Listed here for a reason that is not
# bookkeeping — SC#5 is stated in terms of the clean-venv gate, so a mesh test
# left off this list would pass locally and be invisible to the only run that
# counts. `check_framework_uninstalled.sh`'s non-vacuity guard turns that
# omission into a red build rather than a cheerful green one.
"tests/test_mesh.py" = "paaf_llm/tests/test_mesh.py"
"tests/test_mesh_trace.py" = "paaf_llm/tests/test_mesh_trace.py"
"tests/test_observer.py" = "paaf_llm/tests/test_observer.py"
