[project]
name = "paaf-trace"
version = "0.1.0"
description = "PAAF trace store: SQLite (WAL), single-writer bounded queue, time_to_first_audio metric."
requires-python = ">=3.12"
# aiosqlite for the async single-writer trace store; paaf-core for config only
# (Architectural Responsibility Map: trace depends on core, never the reverse).
dependencies = [
    "aiosqlite",
    "paaf-core",
]

[tool.uv.sources]
paaf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paaf_trace"]
