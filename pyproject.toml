# SPDX-License-Identifier: Apache-2.0
[project]
name = "paaf-workspace"
version = "0.1.0"
description = "PAAF monorepo workspace root (virtual — not a distributable package)."
requires-python = ">=3.12"

[tool.uv]
# The workspace root is a virtual project: it groups members and dev tooling but is
# never built or published itself (D-07: no app packages; this root ships nothing).
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
# --disable-socket is the no-network default (FOUND-03 / PRIV-02): pytest-socket makes
# ANY network (AF_INET/AF_INET6) socket open fail the suite. It is the negative control
# other Phase-2 plans build on.
# --allow-unix-socket permits ONLY local AF_UNIX sockets. asyncio's event-loop self-pipe
# is a socketpair() (AF_UNIX on Unix); without this, every async test would fail at loop
# construction. Unix sockets are local IPC and cannot leave the device, so the no-egress
# guarantee (TRACE-05) is preserved — real network egress still opens an AF_INET socket
# and is still blocked.
# --import-mode=importlib lets identically-named test modules (test_smoke.py) coexist
# across packages without __init__.py files or basename collisions.
# -p no:langsmith_plugin refuses LangSmith's auto-registered pytest plugin. `langsmith`
# arrives transitively with the optional `paaf-llm[engine]` extra, and its plugin is
# loaded by pytest BEFORE any test runs — dragging httpx + requests + urllib3 into
# sys.modules of every test process. That is (a) the LangSmith cloud machinery this
# project explicitly refuses to carry, loaded without anyone asking for it, and (b) a
# false red for paaf-trace's TRACE-05 no-egress control, which reads sys.modules to
# prove no phone-home client is present. Blocking the plugin fixes the cause; making
# that control tolerate an HTTP client instead would have weakened a privacy guard to
# accommodate telemetry. A no-op when the extra is not installed (`-p no:` on an absent
# plugin name is ignored), so the framework-uninstalled suite is unaffected.
addopts = "--disable-socket --allow-unix-socket --import-mode=importlib -p no:langsmith_plugin"
testpaths = ["packages"]
asyncio_mode = "auto"

[dependency-groups]
# Workspace-level dev/CI toolchain. Pinned where Phase-1 established a baseline
# (pytest 9.1.1, pytest-asyncio 1.4.0); pytest-socket pinned to the version resolved
# by `uv sync` in this plan (RESEARCH Assumptions A3 — unpinned during research).
dev = [
    "import-linter",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-socket==0.7.0",
    "ruff",
    "mypy",
    "pyyaml>=6.0.3",
]
